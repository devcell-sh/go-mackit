version: "3"

tasks:
  build:
    desc: Build mackit CLI binary -> ./bin/mackit
    dir: "{{.TASKFILE_DIR}}"
    silent: true
    cmds:
      - mkdir -p /Users/dmitry/dev/devcell-sh/go-mackit/bin
      - go build -o /Users/dmitry/dev/devcell-sh/go-mackit/bin/mackit ./cmd/mackit/

  install:
    desc: Build + copy to ~/.local/bin/mackit
    dir: "{{.TASKFILE_DIR}}"
    deps: [build]
    silent: true
    cmds:
      - mkdir -p ~/.local/bin
      - cp /Users/dmitry/dev/devcell-sh/go-mackit/bin/mackit ~/.local/bin/mackit
      - echo "Installed to ~/.local/bin/mackit"

  test:
    desc: Run unit tests
    cmds:
      - go test $(go list ./... | grep -v '/test/e2e')

  test:race:
    desc: Run tests with race detector
    cmds:
      - go test -race ./...

  test:cover:
    desc: Run tests with coverage
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  tidy:
    desc: Tidy go modules
    cmds:
      - go mod tidy

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin/ coverage.out
